name: train
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: train
        env:
          TRAIN_HANDS: '8000'
          EPOCHS: '2'
          DAGGER_ROUNDS: '0'
        run: node trainer/train.js
      - name: publish weights to orphan state branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/bluffly-w
          cp weights/kc2mbon.i8.gz weights/meta.json /tmp/bluffly-w/
          git checkout --orphan state-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir weights
          cp /tmp/bluffly-w/* weights/
          git add weights/kc2mbon.i8.gz weights/meta.json
          git commit -m "state: bootstrap weights"
          git push -f origin HEAD:state
